[project]
name = "local-voice-ai"
version = "0.1.0"
description = "Locally hosted real-time conversational voice AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "loguru>=0.7.2",
  "numpy>=1.26.0",
  "psutil>=6.0.0",
  "sentence-transformers>=3.3.0",
  "faiss-cpu>=1.9.0",
  "soundfile>=0.12.1",
  "aiofiles>=24.1.0",
  "websockets>=13.0",
  "pipecat-ai[moonshine,kokoro,silero,whisper,websocket,webrtc]==1.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-httpx>=0.34.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[project.scripts]
localvoiceai = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: tests that require local models / Ollama",
  "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
